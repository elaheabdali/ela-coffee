name: CI

on:
  push:
    # The repo's default branch is `master` (all commits so far are on
    # master). The workflow originally listed `main`, so no push would
    # ever have triggered it — fixed in Phase 11 before the first push.
    branches: [master]
  pull_request:

jobs:
  check:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Dependency audit (Phase 7): fails on high/critical advisories.
      # It cannot run in the sandbox used to build this repo — the
      # managed registry policy blocks the audit endpoint there — so
      # the first real result comes from this job.
      - run: pnpm audit --audit-level high

  # Playwright E2E + visual regression (Phase 10): the suite runs on
  # Chromium here (E2E_BROWSER=chromium) because GitHub Actions has
  # Chrome — locally the functional project runs on the cached
  # Firefox instead (see playwright.config.ts). The visual project
  # always runs on Firefox, so the committed baselines in
  # tests/visual/baseline/ are comparable everywhere.
  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium firefox
      - run: pnpm --filter web test:e2e
        env:
          E2E_BROWSER: chromium
